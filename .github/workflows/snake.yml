name: Generate Snake
on: 
  # 允许手动触发
  workflow_dispatch:
  # 推送到 master 分支时触发
  push:
    branches:
    - master

# 补充权限配置，确保 Token 有足够权限
permissions:
  contents: write  # 允许写入仓库内容（用于推送 SVG 文件）
  actions: read    # 基础读取权限

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 生成贪吃蛇 SVG 动画（核心修改：添加 github_token 参数）
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # 关键：传递 GitHub Token 完成授权
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      
      # 推送 SVG 文件到 output 分支（升级到最新版，提升稳定性）
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0  # 升级到最新稳定版
        with:
          target_branch: output
          build_dir: dist
          # 可选：如果分支不存在，自动创建
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
